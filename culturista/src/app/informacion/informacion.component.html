<section class="hero-section">
  <div class="overlay"></div>
    <div class="container">
        <div class="header">
            <img src="assets/montania.jpg" alt="Monserrate" class="place-image">
            <div class="text-container">
                <h1>{{destinoInfo.nombre}}</h1>
                <p class="description">Descripción: {{destinoInfo.descripcion}}</p>
            </div>
        </div>

        <div class="info">
            <p><strong>Ubicación:</strong> {{destinoInfo.ubicacion}}</p>
            <p class="precio"><strong>Costo:</strong> {{destinoInfo.precio}}COP</p>
            <p><strong>Fecha:</strong> {{destinoInfo.fecha}}</p>
            <div class="Recomendaciones" *ngIf="destinoInfo.recomendaciones === undefined || destinoInfo.recomendaciones.length > 0">
                <p><strong>Recomendaciones:</strong></p>
                <ul *ngFor="let rec of destinoInfo.recomendaciones">
                    <li>{{rec}}</li>
                </ul>
            </div>
        </div>

        <div class="buttons">
            <button class="btn return-btn" (click)="returnToForm()">Volver</button>
        </div>
    </div>
</section>
